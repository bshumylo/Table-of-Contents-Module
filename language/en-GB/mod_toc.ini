MOD_TOC="Table of Contents"
MOD_TOC_XML_DESCRIPTION="Automatically builds a table of contents from the headings in the article being viewed. Rendered in the template position it is assigned to, which it fills, and styled by the template; heading levels and behaviour are configurable, no external dependencies."
MOD_TOC_DEFAULT_TITLE="Table of Contents"
MOD_TOC_NOSCRIPT="Enable JavaScript to see the table of contents."

MOD_TOC_FIELDSET_BASIC="Basic"
MOD_TOC_FIELDSET_APPEARANCE="Appearance"
MOD_TOC_FIELDSET_ADVANCED="Advanced"

MOD_TOC_NOTE_TITLE_LABEL="The heading is the module title"
MOD_TOC_NOTE_TITLE_DESC="The box carries no heading of its own: the Module tab decides the title and whether it is shown. With Show Title set to Hide nothing is printed above the list, and the collapse toggle stays available as a marker."

MOD_TOC_FIELD_LEVELS_LABEL="Heading levels"
MOD_TOC_FIELD_LEVELS_DESC="Which heading tags in the article are picked up."

MOD_TOC_FIELD_MIN_ITEMS_LABEL="Minimum headings to show"
MOD_TOC_FIELD_MIN_ITEMS_DESC="The module hides itself when the article has fewer matching headings than this."

MOD_TOC_FIELD_NUMBERED_LABEL="Numbered list"
MOD_TOC_FIELD_COLLAPSIBLE_LABEL="Collapsible"
MOD_TOC_FIELD_COLLAPSED_LABEL="Collapsed by default"
MOD_TOC_FIELD_SMOOTH_SCROLL_LABEL="Smooth scrolling"

MOD_TOC_FIELD_SCROLL_OFFSET_LABEL="Scroll offset (px)"
MOD_TOC_FIELD_SCROLL_OFFSET_DESC="Vertical offset applied when jumping to a heading, useful with a sticky site header."

MOD_TOC_NOTE_THEME_LABEL="Colours and font come from your template"
MOD_TOC_NOTE_THEME_DESC="The box inherits its background, text colour, link colour and font size from the template, so it fits a light and a dark design alike. To restyle this module instance only, set the custom properties listed under Custom CSS below."

MOD_TOC_FIELD_CUSTOM_CLASS_LABEL="Custom CSS class"
MOD_TOC_FIELD_CUSTOM_CLASS_DESC="Extra class added to the wrapper for your own styling."

MOD_TOC_FIELD_CUSTOM_CSS_LABEL="Custom CSS"
MOD_TOC_FIELD_CUSTOM_CSS_DESC="Raw CSS declarations applied to this module instance only — no selector and no braces needed. The module reads these custom properties: <code>--toc-bg</code> background, <code>--toc-border</code> border shorthand such as <code>1px solid #dee2e6</code>, <code>--toc-radius</code> corner rounding, <code>--toc-padding</code> inner spacing, <code>--toc-text</code> text colour, <code>--toc-link</code> link colour, <code>--toc-font-size</code> font size. Plain declarations work too, for example <code>margin-bottom: 2em;</code>. Leave the field empty to keep the template's own styling."

MOD_TOC_FIELD_SELECTOR_LABEL="Article content CSS selector"
MOD_TOC_FIELD_SELECTOR_DESC="CSS selector matching the article body container. Adjust only if your template does not use the standard Joomla markup. If nothing matches, the module locates the article body itself, which is what happens on page builder layouts such as YOOtheme Pro."
