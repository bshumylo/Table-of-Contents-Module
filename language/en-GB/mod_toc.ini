MOD_TOC_NOTE_THEME_LABEL="Colours and font come from your template"
MOD_TOC_NOTE_THEME_DESC="The box inherits its background, text colour, link colour and font size from the template, so it fits a light and a dark design alike. To restyle this module instance only, set the custom properties listed under Custom CSS below."

MOD_TOC_FIELD_CUSTOM_CLASS_LABEL="Custom CSS class"
MOD_TOC_FIELD_CUSTOM_CLASS_DESC="Extra class added to the wrapper for your own styling."

MOD_TOC_FIELD_CUSTOM_CSS_LABEL="Custom CSS"
MOD_TOC_FIELD_CUSTOM_CSS_DESC="Raw CSS declarations applied to this module instance only — no selector and no braces needed. The module reads these custom properties: <code>--toc-bg</code> background, <code>--toc-border</code> border colour, <code>--toc-text</code> text colour, <code>--toc-link</code> link colour, <code>--toc-font-size</code> font size. Plain declarations work too, for example <code>border-radius: 12px;</code> or <code>padding: 1.5em;</code>. Leave the field empty to keep the template's own styling."

MOD_TOC_FIELD_SELECTOR_LABEL="Article content CSS selector"
MOD_TOC_FIELD_SELECTOR_DESC="CSS selector matching the article body container. Adjust only if your template does not use the standard Joomla markup. If nothing matches, the module locates the article body itself, which is what happens on page builder layouts such as YOOtheme Pro."
