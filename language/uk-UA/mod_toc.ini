MOD_TOC="Зміст"
MOD_TOC_XML_DESCRIPTION="Автоматично будує зміст із заголовків статті, яку переглядають. Виводиться у призначеній позиції шаблону, заповнює її по ширині та оформлюється шаблоном; рівні заголовків і поведінка налаштовуються, без зовнішніх залежностей."
MOD_TOC_DEFAULT_TITLE="Зміст"
MOD_TOC_NOSCRIPT="Увімкніть JavaScript, щоб побачити зміст."

MOD_TOC_FIELDSET_BASIC="Основне"
MOD_TOC_FIELDSET_APPEARANCE="Зовнішній вигляд"
MOD_TOC_FIELDSET_ADVANCED="Додатково"

MOD_TOC_NOTE_TITLE_LABEL="Заголовок блоку — це назва модуля"
MOD_TOC_NOTE_TITLE_DESC="Блок не має власного заголовка: назву та її показ визначає вкладка Модуль. Якщо Показувати заголовок = Сховати, над списком не виводиться нічого, а перемикач згортання лишається у вигляді маркера."

MOD_TOC_FIELD_LEVELS_LABEL="Рівні заголовків"
MOD_TOC_FIELD_LEVELS_DESC="Які теги заголовків у статті враховувати."

MOD_TOC_FIELD_MIN_ITEMS_LABEL="Мінімум заголовків для показу"
MOD_TOC_FIELD_MIN_ITEMS_DESC="Модуль ховає себе, якщо у статті менше відповідних заголовків, ніж вказано."

MOD_TOC_FIELD_NUMBERED_LABEL="Нумерований список"
MOD_TOC_FIELD_COLLAPSIBLE_LABEL="Можна згортати"
MOD_TOC_FIELD_COLLAPSED_LABEL="Згорнуто за замовчуванням"
MOD_TOC_FIELD_SMOOTH_SCROLL_LABEL="Плавна прокрутка"

MOD_TOC_FIELD_SCROLL_OFFSET_LABEL="Відступ прокрутки (px)"
MOD_TOC_FIELD_SCROLL_OFFSET_DESC="Вертикальний відступ при переході до заголовка — корисно, якщо шапка сайту є липкою (sticky)."

MOD_TOC_NOTE_THEME_LABEL="Кольори та шрифт беруться з шаблону"
MOD_TOC_NOTE_THEME_DESC="Блок успадковує фон, колір тексту, колір посилань і розмір шрифту від шаблону, тож однаково пасує світлому й темному дизайну. Щоб змінити вигляд лише цього модуля, задайте власні властивості, перелічені нижче у полі Власний CSS."

MOD_TOC_FIELD_CUSTOM_CLASS_LABEL="Власний CSS-клас"
MOD_TOC_FIELD_CUSTOM_CLASS_DESC="Додатковий клас на обгортці модуля для власних стилів."

MOD_TOC_FIELD_CUSTOM_CSS_LABEL="Власний CSS"
MOD_TOC_FIELD_CUSTOM_CSS_DESC="Довільні CSS-правила лише для цього екземпляра модуля — без селектора й фігурних дужок. Модуль розуміє такі власні властивості: <code>--toc-bg</code> фон, <code>--toc-border</code> скорочення для рамки, напр. <code>1px solid #dee2e6</code>, <code>--toc-radius</code> заокруглення, <code>--toc-padding</code> внутрішні відступи, <code>--toc-text</code> колір тексту, <code>--toc-link</code> колір посилань, <code>--toc-font-size</code> розмір шрифту. Звичайні декларації теж працюють, напр. <code>margin-bottom: 2em;</code>. Залиште порожнім, щоб лишити оформлення шаблону."

MOD_TOC_FIELD_SELECTOR_LABEL="CSS-селектор тексту статті"
MOD_TOC_FIELD_SELECTOR_DESC="Селектор, що відповідає контейнеру тексту статті. Змінюйте лише якщо ваш шаблон не використовує стандартну розмітку Joomla. Якщо нічого не знайдено, модуль визначає контейнер статті самостійно — саме так це працює на макетах конструкторів на кшталт YOOtheme Pro."
